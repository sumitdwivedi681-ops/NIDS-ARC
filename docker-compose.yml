
services:
  nids-arc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nids-arc
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    env_file:
      - .env
    volumes:
      - nids-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nids-data:
    driver: local
