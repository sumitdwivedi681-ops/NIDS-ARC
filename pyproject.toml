[project]
name = "NIDS ARC"
version = "0.1.0"
description = "NIDS ARC - Autonomous Scalable Hybrid NIDS/NDR Security Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "redis==5.2.1",
    "pyjwt==2.10.1",
    "bcrypt==4.2.1",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "scikit-learn==1.6.1",
    "numpy==2.2.1",
    "joblib==1.4.2",
    "pyyaml==6.0.2",
    "scapy==2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
]
postgres = [
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
